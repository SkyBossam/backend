services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: aicoo
      POSTGRES_USER: aicoo
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U aicoo -d aicoo]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports:
      - 127.0.0.1:8080:8080
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/aicoo
      DATABASE_USER: aicoo
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      WORKER_KEY: ${WORKER_KEY:?Set WORKER_KEY in .env}
      APP_ENV: development
      MAIL_MODE: local
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
